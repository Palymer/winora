name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WindowsOptimizer.sln

      - name: Build
        run: dotnet build WindowsOptimizer.sln -c Release --no-restore

      - name: Test
        run: dotnet test WindowsOptimizer.sln -c Release --no-build --nologo
